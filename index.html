<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wdth@75..100&display=swap" rel="stylesheet">]
    <title>Projeto JavaScript</title>
</head>
<body>
    <img src="./assets/logo.gif" alt="logo-convert-money" class="hand">
    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>
        <label>
            Converter <b>para</b> 
            <select class="currency-select">
                <option value="dolar">US$ Dolar Americano</option>
                <option value="euro">$ Euro</option>
            </select>
        </label>
        <label>
            Valor
            <input class="input-currecy" placeholder="R$ 10.000,00">
        </label>
            <button class="convert-button">Converter</button>
        <section>
            <div class="currency-box">
                <img src="./assets/Real.png" alt="Logo-moeda-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>
            <img class="arrow" src="./assets/arrow.png" alt="seta">
            <div class="currency-box">
                <img class="currency-img" src="./assets/Dolar.png" alt="Logo-moeda-convertida">
                <p class="currency" id="currency-name">Dólar americano</p>
                <p class="currency-value">US$ 0.0</p>
            </div>
        </section>
    </main>
    <script src="./scripts.js"></script>
</body>
</html>
